[project]
name = "vision-dataset-workbench"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "fastapi>=0.116,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2026.3.17",
]

[project.optional-dependencies]
gpu = [
  "onnxruntime-gpu>=1.26,<1.27",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers>=4.57,<5",
  "ultralytics>=8.4.83,<9",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_dataset_workbench"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "gpu" }]
torchvision = [{ index = "pytorch-cu128", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
